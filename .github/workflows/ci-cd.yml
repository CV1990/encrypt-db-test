name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Variables del repositorio (Settings → Secrets and variables → Actions → Variables)
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.event.repository.name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests unitarios + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encrypt_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: encrypt_db_test
      - run: npm run build

  frontend:
    name: Frontend · tests unitarios + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-frontend
          path: frontend/playwright-report
          retention-days: 7

  integration:
    name: Integración · docker compose (front + back + Postgres)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env con secretos aleatorios
        run: |
          cp .env.example .env
          sed -i "s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^BLIND_INDEX_KEY=.*/BLIND_INDEX_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Levantar el stack
        run: docker compose up -d --build --wait

      - name: Comprobar que Postgres no guarda datos en claro
        run: |
          EMAIL="ci-check-${GITHUB_RUN_ID}@example.com"
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"fullName\":\"Usuario CI\",\"email\":\"$EMAIL\",\"password\":\"Secreta123\"}"
          echo
          docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > dump.sql
          grep -q "INSERT\|COPY public.users" dump.sql
          if grep -qi -e "$EMAIL" -e "Usuario CI" -e "Secreta123" dump.sql; then
            echo "::error::Se encontraron datos en claro en la base de datos"
            exit 1
          fi
          echo "OK: ningún dato personal en claro en el volcado de Postgres"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E del stack completo
        run: npx playwright test fullstack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Logs del stack
        if: failure()
        run: docker compose logs

      - run: docker compose down -v
        if: always()

  docker:
    name: Publicar imagen ${{ matrix.app }}
    needs: [integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Docker Hub exige nombres en minúsculas: <usuario>/<IMAGE_NAME>-backend|frontend
      - name: Nombre de la imagen
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "IMAGE=${DOCKERHUB_USERNAME,,}/${IMAGE_NAME,,}-${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
